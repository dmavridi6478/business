<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint caption and chart slide</title>
<style>
  /* Template: an explainer slide on a blueprint-blue grid - a white chart card on top (two tiles: a before/after bar pair and a big stat), then two bold caption blocks in white highlight boxes.
     Pattern from the @aiclawbots CodeGraph slides. Numbers shown are placeholders marked "Illustrative"; replace them with measured figures. 4:5 canvas.
     Customise: tile content, caption text, --blue grid colour. */
  :root { --bg:#0b4a85; --grid:rgba(255,255,255,.12); --card:#f2f6fc; --ink:#0f2238; --muted:#5b6b82; --navy:#0f2238; --bad:#e0545a; --bad-bg:#f8c9cb; --good:#3b82f6; --hi:#38d27a; --white:#fff; --font: Aptos, "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, "SF Mono", Consolas, monospace; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#06233f; --card:#e6ecf5; } }
  :root[data-theme="dark"] { --bg:#06233f; --card:#e6ecf5; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); font-family: var(--font); padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; justify-items: center; }
  .slide { container-type: inline-size; width: min(100%, 540px); aspect-ratio: 4 / 5; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 6cqw 6cqw; padding: 10cqw 7cqw 6cqw; display: grid; grid-template-rows: auto 1fr auto; gap: 5cqw; border-radius: 4px; }
  .card { background: var(--card); border-radius: 3cqw; padding: 3cqw; display: grid; grid-template-columns: 1.5fr 1fr; gap: 3cqw; }
  .tile { background: #fff; border: .5cqw solid var(--navy); border-radius: 2cqw; padding: 3cqw; display: grid; gap: 1.8cqw; align-content: start; box-shadow: .9cqw .9cqw 0 var(--navy); font-size: 2.4cqw; color: var(--ink); }
  .tile h2 { font-size: 3cqw; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2cqw; align-items: center; font-family: var(--mono); }
  .track { height: 4cqw; border-radius: .8cqw; background: #e6ecf5; overflow: hidden; } .fill { height: 100%; background: var(--bad); } .fill.b { background: var(--good); }
  .stat { background: var(--navy); color: #fff; border-radius: 2cqw; padding: 3cqw; display: grid; align-content: space-between; font-size: 2.4cqw; }
  .stat b { font-size: 9cqw; color: var(--hi); line-height: 1; }
  .ill { font-size: 2cqw; color: var(--muted); text-align: right; }
  .caps { display: grid; gap: 3cqw; justify-items: center; text-align: center; align-self: end; }
  .caps p { font-weight: 800; font-size: 5.6cqw; line-height: 1.5; color: #000; }
  .caps p span { background: #fff; padding: .6cqw 2cqw; border-radius: 1.2cqw; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .handle { color: #fff; font-weight: 700; font-size: 3.4cqw; justify-self: end; }
</style>
</head>
<body>
<section class="slide">
  <div class="card">
    <div class="tile"><h2>Tokens per session</h2>
      <div class="row"><span>Before</span><b>52.4k</b></div><div class="track"><div class="fill" style="width:92%"></div></div>
      <div class="row"><span>With the tool</span><b>15.7k</b></div><div class="track"><div class="fill b" style="width:28%"></div></div>
      <span class="ill">Illustrative</span></div>
    <div class="stat"><span>token usage</span><b>-70%</b><span>Replace with a measured figure</span></div>
  </div>
  <div></div>
  <div class="caps"><p><span>Say the result in one bold sentence</span></p><p><span>Then say what it means for the reader in a second one</span></p><span class="handle">@yourhandle</span></div>
</section>
</body>
</html>
