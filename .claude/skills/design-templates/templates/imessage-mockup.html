<!doctype html>
<!--
  iMessage-style chat mockup, self-contained (no external assets/fonts required
  beyond system UI fonts). Inspired by the class of tool "Javii" (javii.tools)
  provides as a paid one-click app — this is a free, editable equivalent.

  Usage: duplicate a <div class="bubble ..."> per message, edit the text and
  the data-time label. Swap --accent for the brand/product color.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>iMessage mockup</title>
<style>
  :root {
    --accent: #0b84ff;          /* iMessage blue — swap for brand color */
    --bg-outer: #e9e9eb;
    --bg-received: #e9e9eb;
    --text-received: #000;
    --text-sent: #fff;
    --frame-radius: 44px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #1c1c1e;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  .phone {
    width: 375px;
    height: 812px;
    background: #000;
    border-radius: var(--frame-radius);
    padding: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
  .screen {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: calc(var(--frame-radius) - 14px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .status-bar { height: 44px; flex: 0 0 auto; }
  .header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 0 10px;
    border-bottom: 1px solid #e5e5ea;
  }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg,#a1a1aa,#71717a);
    margin-bottom: 6px;
  }
  .header .name { font-size: 12px; color: #8e8e93; }
  .thread {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .day-label {
    text-align: center;
    font-size: 11px;
    color: #8e8e93;
    margin: 6px 0 10px;
  }
  .bubble {
    max-width: 72%;
    padding: 9px 14px;
    border-radius: 18px;
    font-size: 16.5px;
    line-height: 1.32;
    position: relative;
  }
  .bubble.received {
    align-self: flex-start;
    background: var(--bg-received);
    color: var(--text-received);
    border-bottom-left-radius: 4px;
  }
  .bubble.sent {
    align-self: flex-end;
    background: var(--accent);
    color: var(--text-sent);
    border-bottom-right-radius: 4px;
  }
  .bubble + .bubble.sent, .bubble + .bubble.received { margin-top: -2px; }
  .timestamp {
    align-self: center;
    font-size: 10.5px;
    color: #8e8e93;
    margin: 8px 0 2px;
  }
  .input-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 18px;
    border-top: 1px solid #e5e5ea;
  }
  .input-pill {
    flex: 1;
    height: 34px;
    border-radius: 17px;
    border: 1px solid #d1d1d6;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #8e8e93;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="status-bar"></div>
      <div class="header">
        <div class="avatar"></div>
        <div class="name">Jamie</div>
      </div>
      <div class="thread">
        <div class="day-label">Today 9:41 AM</div>
        <div class="bubble received">hey — did the deck go out?</div>
        <div class="bubble sent">just sent, check your inbox</div>
        <div class="bubble sent">let me know what you think of slide 4</div>
        <div class="timestamp">Delivered</div>
        <div class="bubble received">looking now 👀</div>
      </div>
      <div class="input-bar">
        <div class="input-pill">iMessage</div>
      </div>
    </div>
  </div>
</body>
</html>
