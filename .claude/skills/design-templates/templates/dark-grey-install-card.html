<!DOCTYPE html>
<!--
  Template: dark-grey-install-card
  Style: @the.wealth.lab "6 MCP servers" - flat charcoal square, a black logo band across the top, a yellow underlined heading "NN. Name", a white bold subtitle, centred white body,
         a yellow INSTALL label and a monospace-looking command, handle bottom-right.
  Inspired by: Batch 101 iCloud photos (cover, Context7, GitHub, Exa, Playwright, Supabase, Sentry, "why these 6 work together").
  Swap points: BRAND (text in the band), HANDLE, ITEMS [heading, subtitle, body, install command].   1080 x 1080 shown at 36 %.
  Rule: put the correct install command on the card. The original carousel pasted the GitHub URL on its Context7 card.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Grey Install Card</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --s: 0.36; --bg: #404044; --band: #000; --yellow: #ffe51f; --amber: #f2b705; --ink: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #101012; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; font-family: 'Inter', Arial, sans-serif; }
  .frame { width: calc(1080px * var(--s)); height: calc(1080px * var(--s)); }
  .slide { width: 1080px; height: 1080px; transform: scale(var(--s)); transform-origin: top left; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); text-align: center; }
  .band { margin-top: 60px; height: 150px; background: var(--band); display: grid; place-items: center; font-family: 'Oswald', Impact, sans-serif; font-weight: 700; font-size: 74px; letter-spacing: .02em; color: var(--yellow); }
  h1 { margin-top: 96px; font-size: 52px; font-weight: 800; color: var(--yellow); text-decoration: underline; text-underline-offset: 8px; }
  h2 { margin-top: 12px; font-size: 40px; font-weight: 800; }
  p { margin: 44px auto 0; max-width: 880px; font-size: 38px; line-height: 1.34; font-weight: 800; }
  .lbl { margin-top: 56px; font-size: 40px; font-weight: 800; color: var(--amber); }
  code { display: block; margin: 12px auto 0; max-width: 900px; font-family: 'Inter', Arial, sans-serif; font-size: 36px; font-weight: 800; line-height: 1.3; word-break: break-all; }
  .by { position: absolute; right: 50px; bottom: 40px; font-size: 36px; font-weight: 600; opacity: .9; }
</style>
</head>
<body>
<div id="out" style="display:contents"></div>
<script>
/* ── SWAP THESE ── */
const BRAND = "Your Brand", HANDLE = "@yourhandle";
const ITEMS = [
  ["01. Context7", "Claude’s Documentation Expert", "Fetches current, version-specific documentation and code examples so Claude works from the APIs your project actually uses.", "claude mcp add --transport http context7 https://mcp.context7.com/mcp"],
  ["03. Exa MCP", "Claude’s Researcher", "A search engine built for AI agents. Searches the live web and fetches clean page content.", "claude mcp add --transport http exa https://mcp.exa.ai/mcp"],
  ["04. Playwright MCP", "Claude’s QA Engineer", "Gives Claude a real browser it can control: navigate, click, fill forms, take screenshots and test user flows.", "claude mcp add playwright -- npx @playwright/mcp@latest"]
];
const out = document.getElementById("out");
ITEMS.forEach(([h, sub, body, cmd]) => {
  const f = document.createElement("div"); f.className = "frame";
  f.innerHTML = `<div class="slide"><div class="band">${BRAND}</div><h1>${h}</h1><h2>${sub}</h2><p>${body}</p><div class="lbl">INSTALL</div><code>${cmd}</code><div class="by">${HANDLE}</div></div>`;
  out.append(f);
});
</script>
</body>
</html>
