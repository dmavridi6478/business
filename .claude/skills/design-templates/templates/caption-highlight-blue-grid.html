<!DOCTYPE html>
<!--
  Template: caption-highlight-blue-grid
  Style: deep blue graph-paper page, a white rounded diagram card, and caption lines set on individual white highlighter strips
         in bold black sans; a handle at the bottom right. Theme: blueprint-captions
  Inspired by: the short-video slides of the Hermes LinkedIn series (@aiclawbots) and the money-photo caption slides (@penny.blanco6). Original CSS; no source art.
  Canvas: 1080 x 1920. Two slides in one file: .slide--blue (grid + diagram card + captions) and .slide--photo (your photo under a scrim + captions).
  Swap points:
    :root tokens                  colours and fonts
    .card                         put your own diagram or screenshot inside (replace the placeholder nodes)
    .cap span                     one span per caption line; each gets its own white strip
    --photo                       your own photo for the photo slide (default is a CSS gradient so the file works with no image)
    .handle                       your own handle (placeholder: @yourhandle)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption Highlight Blue Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #044672;        /* sampled: blue slide background */
    --grid: rgba(255,255,255,.14);
    --strip: #FFFFFF;
    --ink: #111111;
    --accent: #3AA0FF;
    --photo: linear-gradient(170deg, #5b4a2e 0%, #2e3a4a 45%, #1a1f27 100%);
    --font: "Montserrat", Aptos, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 32px 0; overflow-x: auto; font-family: var(--font); }
  .slide { position: relative; width: 1080px; height: 1920px; flex: none; overflow: hidden; }
  .slide--blue { background-color: var(--blue); background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px); background-size: 96px 96px; }
  .slide--photo { background: linear-gradient(rgba(8,8,10,.5), rgba(8,8,10,.5)), var(--photo); background-size: cover; background-position: center; }
  .card { position: absolute; left: 90px; right: 90px; top: 280px; height: 700px; background: #fff; border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: space-around; padding: 40px; }
  .node { width: 200px; height: 200px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #fff; background: var(--accent); }
  .node.mid { width: 300px; height: 180px; border-radius: 28px; background: #0D2B3F; }
  .cap { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; padding: 0 70px; }
  .cap span { background: var(--strip); color: var(--ink); font-size: 48px; line-height: 1.28; font-weight: 700; padding: 6px 22px; letter-spacing: -.01em; }
  .slide--blue .cap { top: 1130px; }
  .slide--photo .cap { top: 780px; }
  .slide--photo .cap span { font-weight: 600; }
  .handle { position: absolute; right: 54px; bottom: 90px; color: #fff; font-size: 42px; font-weight: 600; }
</style>
</head>
<body>

<section class="slide slide--blue">
  <div class="card" role="img" aria-label="Placeholder for your diagram"><div class="node">Input</div><div class="node mid">Your tool</div><div class="node">Output</div></div>
  <div class="cap"><span>Because they're open source</span><span>and built in a shared format,</span><span>you're not locked in either</span></div>
  <div class="handle">@yourhandle</div>
</section>

<section class="slide slide--photo">
  <div class="cap"><span>Tool name: what it does</span><span>in one plain line, with</span><span>the real catch said once</span></div>
  <div class="handle">@yourhandle</div>
</section>

</body>
</html>
