<!DOCTYPE html>
<!--
  Ranked tools table, purple - 800x1000 (4:5). Inspired by the "GTMs toolkit: 9 AI tools" card, redrawn from scratch (no logos).
  SWAP POINTS: tokens in :root; the ROWS array (name, place, best, why); the title and side note.
  Font: Aptos per house style, system fallback. Export: Chromium at 800x1000. Responsive below 840px (table scrolls inside .wrap).
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranked Tools Table</title>
<style>
:root{--bg:#f4f1fb;--ink:#14122b;--purple:#6d3df5;--purple-d:#4a22c9;--soft:#ede7ff;--line:#e3dcf7;--card:#fff;--font:Aptos,"Aptos Display","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:var(--font)}
.card{width:800px;min-height:1000px;margin:0 auto;background:var(--bg);padding:36px 30px}
.pill{display:inline-block;background:var(--soft);color:var(--purple-d);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:6px 16px}
.head{display:flex;gap:24px;align-items:center;margin:16px 0 22px}
h1{font-size:44px;line-height:1.05;font-weight:900;letter-spacing:-.03em;flex:1}h1 em{font-style:normal;color:var(--purple)}
.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.35;max-width:210px}
.wrap{overflow-x:auto;border-radius:16px;box-shadow:0 2px 10px #2b1a6a1a}
table{border-collapse:collapse;width:100%;min-width:720px;background:var(--card)}
thead th{background:linear-gradient(90deg,var(--purple),var(--purple-d));color:#fff;text-align:left;font-size:16px;padding:14px 12px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px;line-height:1.3}
td.n{width:46px}.n span{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--purple);color:#fff;font-weight:800}
td.t{font-weight:800;font-size:17px;width:150px}
@media (max-width:840px){body{background:var(--bg)}.card{width:100%;min-height:0;padding:20px 16px}.head{flex-direction:column;align-items:flex-start}h1{font-size:30px}.note{max-width:none}}
</style></head><body><section class="card">
<span class="pill">GTM toolkit</span>
<div class="head"><h1>9 AI tools for <em>GTM outbound</em> operations</h1><p class="note">The best tools to scale your outbound engine and drive more revenue.</p></div>
<div class="wrap"><table><thead><tr><th></th><th>Tool</th><th>Place in workflow</th><th>Best feature</th><th>Importance</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const ROWS=[
["Common Room","Identifying ready-to-buy prospects","High-intent signal tracking","Replaces cold calls with warm leads"],
["Perplexity","Deep-dive pre-call or email intel","Real-time account and market research","Context for personalised messaging"],
["Smartlead","Scaling outbound email infrastructure","Multi-mailbox warm-up","Critical for landing in the inbox"],
["Lavender","Optimising outbound copy before sending","Real-time email scoring","Boosts reply rates"],
["Lindy AI","Automating niche admin GTM tasks","Custom no-code AI agents","Swiss-army knife for ops"],
["Gong","Post-outreach analysis and deal closing","Revenue intelligence from calls","Aligns messaging with winning deals"],
["Clay","Lead research and list building","Multi-source waterfall enrichment","Personalised data at scale"],
["Lusha","Lead contact verification","Direct mobile and email accuracy","Reach a human"],
["Surfe","Bridging social selling with CRM","One-click CRM and LinkedIn sync","Removes manual data entry"]];
document.getElementById("rows").innerHTML=ROWS.map((r,i)=>`<tr><td class="n"><span>${i+1}</span></td><td class="t">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("");
</script>
</section></body></html>
