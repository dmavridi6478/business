<!doctype html>
<!--
  Moodboard / logo-reference grid, inspired by Logo System (logosystem.co).
  CSS Grid with mixed tile sizes so a set of reference logos/colors/screenshots
  reads as a curated board rather than a plain list.

  Usage: replace each .tile's background/content with a real logo, color swatch,
  or reference screenshot. Add/remove `.tile--wide` / `.tile--tall` as needed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moodboard grid</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: #f5f5f4;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }
  .toolbar input {
    flex: 1;
    max-width: 320px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid #ddd;
    padding: 0 14px;
    font-size: 14px;
  }
  .toolbar .pill {
    height: 38px;
    padding: 0 14px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #555;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 120px;
    gap: 12px;
  }
  .tile {
    border-radius: 14px;
    display: flex;
    align-items: flex-end;
    padding: 12px;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.01em;
    text-shadow: 0 1px 4px rgba(0,0,0,.25);
    background-size: cover;
    background-position: center;
  }
  .tile--wide { grid-column: span 2; }
  .tile--tall { grid-row: span 2; }

  /* Placeholder fills — swap each for a real logo/reference image */
  .tile-1 { background: linear-gradient(140deg,#f43f5e,#fb923c); }
  .tile-2 { background: linear-gradient(140deg,#111827,#374151); align-items: center; justify-content: center; }
  .tile-3 { background: linear-gradient(140deg,#38bdf8,#818cf8); }
  .tile-4 { background: linear-gradient(140deg,#facc15,#f59e0b); color: #1c1917; text-shadow: none; }
  .tile-5 { background: linear-gradient(140deg,#a3e635,#22c55e); color: #052e16; text-shadow: none; }
  .tile-6 { background: linear-gradient(140deg,#e879f9,#a855f7); }
  .tile-7 { background: linear-gradient(140deg,#0ea5e9,#0369a1); }
</style>
</head>
<body>
  <div class="toolbar">
    <input placeholder="Search logos, colors, styles...">
    <div class="pill">Gallery</div>
    <div class="pill">Moodboard</div>
  </div>
  <div class="grid">
    <div class="tile tile-1 tile--wide">Veggo</div>
    <div class="tile tile-2">ZUDO</div>
    <div class="tile tile-3">Lumio</div>
    <div class="tile tile-4 tile--tall">Saiko Sushi</div>
    <div class="tile tile-5">Wavelength</div>
    <div class="tile tile-6 tile--wide">Vitiglow</div>
    <div class="tile tile-7">Arrive</div>
  </div>
</body>
</html>
