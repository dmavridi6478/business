<!DOCTYPE html>
<!--
  Template: paper-tool-card
  Style: @clicksandranks "5 websites most business owners don't know exist" - warm off-white textured paper, a big heavy grotesque title, a teal underlined link with a chain
         icon, a one-line description, a browser-window screenshot with soft shadow, "NN/05" counter top-right and a bold italic "SAVE FOR LATER" bottom-right.
  Inspired by: Batch 101 iCloud photos (Wave, SERPtag, Looka, Google Business Profile, Manychat, cover with yellow highlighter).
  Swap points: SITES array [name, domain, description, screenshot colour], HANDLE.   1080 x 1350 shown at 36 %.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Tool Card</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root { --s: 0.36; --paper: #efebe4; --ink: #0c0c0c; --teal: #1596a8; --hi: #f8f0a4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #bdb8ae; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; font-family: 'Archivo', Arial, sans-serif; }
  .frame { width: calc(1080px * var(--s)); height: calc(1350px * var(--s)); }
  .slide { width: 1080px; height: 1350px; transform: scale(var(--s)); transform-origin: top left; position: relative; overflow: hidden; background-color: var(--paper); color: var(--ink); text-align: center; padding: 150px 70px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .3  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .count { position: absolute; right: 56px; top: 44px; font-size: 40px; font-weight: 500; }
  h1 { font-size: 150px; line-height: .95; font-weight: 900; letter-spacing: -.05em; }
  .link { margin-top: 36px; font-size: 58px; color: var(--teal); text-decoration: underline; text-underline-offset: 8px; font-weight: 500; }
  .desc { margin: 40px auto 0; max-width: 880px; font-size: 50px; line-height: 1.22; font-weight: 500; letter-spacing: -.01em; }
  .shot { position: absolute; left: 60px; right: 60px; top: 740px; height: 470px; background: #fff; border-radius: 14px 14px 0 0; box-shadow: 0 30px 70px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.08); overflow: hidden; }
  .shot:before { content: ''; display: block; height: 48px; background: #f1f1f1; border-bottom: 1px solid #ddd; }
  .shot i { position: absolute; left: 24px; right: 24px; top: 100px; bottom: 0; border-radius: 12px 12px 0 0; background: var(--c); opacity: .9; }
  .save { position: absolute; right: 56px; bottom: 34px; font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: -.01em; }
  .cover h1 { font-size: 200px; text-align: left; } .cover mark { background: var(--hi); color: var(--ink); font-size: 120px; font-weight: 800; letter-spacing: -.05em; line-height: 1.1; padding: 0 20px; display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
</style>
</head>
<body>
<div id="out" style="display:contents"></div>
<script>
/* ── SWAP THESE ── */
const SITES = [
  ["Wave", "waveapps.com", "Free invoicing and accounting software, no monthly fee.", "#c9d6f2"],
  ["SERPtag", "serptag.com", "Find and track your SEO ranking and improve your online visibility.", "#d9efe2"],
  ["Looka", "looka.com", "AI-generated logo and full brand kit in minutes.", "#f2cfa3"]
];
const out = document.getElementById("out");
const cover = document.createElement("div"); cover.className = "frame";
cover.innerHTML = `<div class="slide cover" style="padding-top:330px"><h1>5 websites</h1><div style="margin-top:50px;text-align:left"><mark>most business owners don't know exist</mark></div><div class="save">SAVE FOR LATER</div></div>`;
out.append(cover);
SITES.forEach(([n, d, text, c], i) => {
  const f = document.createElement("div"); f.className = "frame";
  f.innerHTML = `<div class="slide"><div class="count">${String(i + 1).padStart(2, "0")}/05</div><h1>${n}</h1><div class="link">&#128279; ${d}</div><div class="desc">${text}</div><div class="shot"><i style="--c:${c}"></i></div><div class="save">SAVE FOR LATER</div></div>`;
  out.append(f);
});
</script>
</body>
</html>
