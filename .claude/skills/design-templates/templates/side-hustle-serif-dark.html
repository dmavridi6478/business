<!DOCTYPE html>
<!--
  Template: side-hustle-serif-dark
  Style: near-black warm page, a short green rule, a two-line serif headline (first line mixed case, second line capitals), monospace body text, and either a five-box pipeline (SOURCE-AI-CHECK-PACKAGE-SELL) or a COPY THIS prompt box with green outline. Theme: hustle-serif-dark
  Inspired by: an AI side-hustle carousel (@earchoe). Original CSS; no source wording reused.
  Canvas: 1080 x 1350. Use .prompt for prompt slides, .pipe for process slides, .quad for four-step slides.
  Swap points: h1 (.a first line, .b second line), .body, .pipe li, .prompt, .quad div, .note (caution line), .handle
-->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Hustle Serif Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141310;--ink:#F4F1E8;--muted:#B9B4A4;--green:#5EE08A;--line:#3A382F;--serif:"Playfair Display",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;display:flex;justify-content:center;padding:32px 0;overflow-x:auto}
.slide{position:relative;width:1080px;height:1350px;flex:none;background:var(--bg);color:var(--ink);padding:0 90px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.rule{width:160px;height:5px;background:var(--green);margin-bottom:34px}
h1{font:700 76px/1.06 var(--serif);letter-spacing:-.02em}h1 .b{display:block;font-weight:800;text-transform:uppercase}
.body{margin-top:40px;font:500 32px/1.6 var(--mono);color:var(--muted);max-width:880px}
.pipe{margin-top:56px;list-style:none;display:flex;align-items:center;gap:0}
.pipe li{flex:1;border:3px solid var(--green);border-radius:20px;padding:26px 0;text-align:center;font:700 22px/1 var(--mono);letter-spacing:.06em}.pipe li+li{margin-left:32px;position:relative}.pipe li+li::before{content:"→";position:absolute;left:-30px;top:50%;transform:translateY(-50%);color:var(--green);font-size:26px}
.prompt{margin-top:34px;border:3px solid var(--green);border-radius:20px;padding:30px;font:500 26px/1.55 var(--mono);color:var(--ink)}.prompt small{display:block;margin-bottom:14px;color:var(--green);font:700 20px/1 var(--mono);letter-spacing:.12em}
.quad{margin-top:54px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.quad div{border-top:4px solid var(--green);padding-top:16px;font:500 22px/1.4 var(--mono);color:var(--muted)}.quad b{display:block;color:var(--green);font:700 20px/1 var(--mono);letter-spacing:.1em;margin-bottom:10px}
.note{margin-top:44px;border:1px solid var(--line);border-radius:14px;padding:18px 22px;font:500 21px/1.5 var(--mono);color:var(--muted)}
.handle{position:absolute;right:90px;bottom:70px;font:500 30px/1 var(--mono);color:var(--muted)}
</style></head><body>
<div class="slide">
  <div class="rule"></div>
  <h1>Headline in sentence case<span class="b">Second line in capitals</span></h1>
  <p class="body">Two or three short lines of monospace body text stating the rule.</p>
  <ul class="pipe"><li>SOURCE</li><li>AI</li><li>CHECK</li><li>PACKAGE</li><li>SELL</li></ul>
  <div class="note">Caution line: features, pricing and access change by product, plan and region. Verify official documentation first.</div>
  <div class="handle">@yourhandle</div>
</div></body></html>
