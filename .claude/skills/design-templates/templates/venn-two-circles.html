<!DOCTYPE html>
<!--
  Template: venn-two-circles
  Style: "Where AI And Sales Meet" - ruled-paper background, two big translucent circles (lilac / amber) overlapping, a white "How they collaborate" pill in the middle,
         highlighted two-line title with coloured marker boxes, bullet lists on the sides, tag pills at the foot of each circle.
  Swap points: :root colours; TITLE (two lines + highlighted words); LEFT, RIGHT ({name, label, items, tag}); MID ({label, rows:[[bold, rest]]}). Works for any A vs B + overlap.
  Layout: circles are CSS (border-radius 50%), the overlap panel sits above both; at <760px the three blocks stack.
-->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venn two circles</title>
<style>
:root{--paper:#f4f3ef;--ruled:#e4e2dc;--ink:#14141a;--mute:#4b4b55;--a:#cdbcf6;--a-ink:#6a49c9;--b:#f2c36b;--b-ink:#b9791a;--mid:#cf9f9d;--label:#3b4fd1;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 38px,var(--ruled) 38px 39px);color:var(--ink);font-family:Aptos,"Segoe UI",Arial,sans-serif;padding:20px 16px;display:flex;justify-content:center}
.wrap{width:min(960px,100%)}
h1{font-size:32px;line-height:1.2;text-align:center;font-weight:800;margin-bottom:22px}
h1 mark{padding:0 10px;border-radius:3px}.m1{background:var(--a)}.m2{background:var(--b)}
.venn{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:560px}
.c{border:1.5px solid #555;border-radius:50%;padding:12% 8% 8%;position:relative;min-width:0;display:flex;flex-direction:column;gap:10px}
.c.l{background:#cdbcf688;margin-right:-11%;padding-right:33%}.c.r{background:#f2c36b99;margin-left:-11%;padding-left:33%}
.c h2{font-size:30px;text-align:center}
.pill{align-self:center;background:var(--label);color:#fff;font-weight:700;font-size:12px;padding:2px 10px;border-radius:3px}
.c ul{padding-left:18px;font-size:13.5px;line-height:1.35}.c li{margin-bottom:5px}
.tag{margin-top:auto;align-self:center;font-weight:800;font-size:15px;padding:6px 14px;border-radius:3px;text-align:center}
.l .tag{background:var(--a)}.r .tag{background:var(--b)}
.mid{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:27%;min-width:190px;background:var(--mid);border:1.5px solid #555;border-radius:48% / 36%;padding:18px 12px;text-align:center;font-size:11.5px;line-height:1.3}
.mid .lab{display:inline-block;background:var(--white);font-weight:800;font-size:15px;padding:3px 8px;margin-bottom:8px;border-radius:3px}
.mid p{margin-bottom:9px}.mid b{font-weight:800}
@media (max-width:760px){.venn{grid-template-columns:1fr;min-height:0;gap:12px}.c,.c.l,.c.r{margin:0;border-radius:24px;padding:18px}.mid{position:static;transform:none;width:100%;border-radius:24px;order:2}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#15151b;--ruled:#22222b;--ink:#f1f1f6;--mute:#b4b4c0;--a:#4a3d86;--b:#8a6420;--mid:#6a4a4a;--white:#101018}.c{border-color:#aaa}.c.l{background:#4a3d8688}.c.r{background:#8a642099}.mid{border-color:#aaa}.mid .lab{color:#f1f1f6}.l .tag,.m1{background:#4a3d86}.r .tag,.m2{background:#8a6420}}
</style></head><body>
<div class="wrap"><h1 id="t"></h1><div class="venn" id="v"></div></div>
<script>
const TITLE=[['Where '],['AI','m1'],[' And '],['Sales','m2'],[' Meet']];
const LEFT={name:'AI',label:'What it does best:',tag:'Free up your selling time.',items:['Prospect research and enrichment','CRM updates and call logging','Meeting prep briefs and agendas','Follow-up email drafts at scale','Pipeline reporting and forecasting']};
const RIGHT={name:'HUMAN',label:'What it does best:',tag:'Build trust that closes the deal.',items:['Discovery conversations that build trust','Reading the room in live calls','Real-time objection handling','Presenting proposals','Negotiating price and terms']};
const MID={label:'How they collaborate:',rows:[['Call prep','AI researches, human builds the angle'],['Follow-up emails','AI drafts, human personalises'],['Discovery notes','AI captures, human flags what matters'],['Proposal building','AI structures, human writes the narrative'],['Deal strategy','AI surfaces patterns, human makes the call'],['Pipeline prioritisation','AI scores, human decides the focus']]};
const t=document.getElementById('t');TITLE.forEach(p=>{if(p[1]){const m=document.createElement('mark');m.className=p[1];m.textContent=p[0];t.appendChild(m)}else t.appendChild(document.createTextNode(p[0]))});
const v=document.getElementById('v');
function circ(o,cls){const d=document.createElement('div');d.className='c '+cls;const h=document.createElement('h2');h.textContent=o.name;const p=document.createElement('span');p.className='pill';p.textContent=o.label;const u=document.createElement('ul');o.items.forEach(x=>{const li=document.createElement('li');li.textContent=x;u.appendChild(li)});const g=document.createElement('div');g.className='tag';g.textContent=o.tag;[h,p,u,g].forEach(e=>d.appendChild(e));return d}
v.appendChild(circ(LEFT,'l'));v.appendChild(circ(RIGHT,'r'));
const m=document.createElement('div');m.className='mid';const lb=document.createElement('div');lb.className='lab';lb.textContent=MID.label;m.appendChild(lb);
MID.rows.forEach(([b,r])=>{const p=document.createElement('p');const s=document.createElement('b');s.textContent=b+' - ';p.appendChild(s);p.appendChild(document.createTextNode(r));m.appendChild(p)});v.appendChild(m);
</script></body></html>
