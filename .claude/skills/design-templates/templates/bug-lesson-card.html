<!DOCTYPE html>
<!--
  Template: bug-lesson-card
  Style: @jek.notes engineering carousel - off-white paper, heavy condensed black headline with one red line,
         red "label" tags (The problem / What to do / Think), arrow bullets, a small flow diagram, footer with counter.
  Swap points: :root colours; the SLIDE object (kicker, headline lines, problem, todo, think, flow, example). 
  4:5 card, 540 x 675. Falls back to Impact / Arial Narrow if Anton is not available.
-->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bug Lesson Card</title>
<style>
:root{--paper:#F1F0EE;--ink:#141414;--red:#C8202F;--mute:#5E5E5E;--line:#CFCDC9;--box:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#bdbab5;display:flex;justify-content:center;padding:16px;font-family:Aptos,"Segoe UI",Arial,sans-serif}
.card{width:540px;height:675px;background:var(--paper);color:var(--ink);padding:26px 30px 18px;display:flex;flex-direction:column;position:relative}
.kick{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);border-bottom:2px solid var(--red);width:max-content;padding-bottom:6px}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:38px;line-height:1.02;margin-top:14px;text-transform:uppercase;letter-spacing:.3px}
h1 em{font-style:normal;color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:7px;min-width:0}
.tag{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;width:max-content;border-radius:2px}
.col p,.col li{font-size:11.5px;line-height:1.35}
.col ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.col li::before{content:"\2192";color:var(--red);margin-right:6px;font-weight:700}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;background:var(--box);border:1px solid var(--line);padding:3px 6px;border-radius:3px;width:max-content;max-width:100%}
.flow{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.flow .mono::after{content:""}
.think{border:1.5px solid var(--red);padding:8px 10px;font-size:12px;line-height:1.3;margin-top:4px}
.think b{color:var(--red)}
.foot{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
@media (max-width:600px){.card{width:100%;height:auto;min-height:640px}.cols{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#1A1A1C;--ink:#F1F0EE;--mute:#A8A6A2;--line:#38383B;--box:#252527;--red:#FF5C6A}}
</style></head><body>
<section class="card" id="card">
 <div class="kick" id="kick"></div>
 <h1 id="h1"></h1>
 <div class="cols">
  <div class="col"><span class="tag">The problem</span><p id="problem"></p><div class="flow" id="flow"></div></div>
  <div class="col"><span class="tag">What to do</span><ul id="todo"></ul><div class="think" id="think"></div></div>
 </div>
 <div class="foot"><span>YOUR NAME</span><span id="count"></span><span>@yourhandle</span></div>
</section>
<script>
const SLIDE={kick:'01 — Race conditions',h:['When two requests','touch the','<em>same data.</em>'],
problem:'Two requests arrive almost at the same time. Both read stock = 1 and both think they can buy it. Now stock = -1. The code was correct when requests ran one at a time.',
flow:['REQUEST 1  +  REQUEST 2','both read stock = 1','stock = -1'],
todo:['transactions','atomic operations','locks','unique constraints'],
think:'<b>Think:</b> What if these two operations happen at the same time?',count:'02 / 07'};
document.getElementById('kick').textContent=SLIDE.kick;
document.getElementById('h1').innerHTML=SLIDE.h.join('<br>');
document.getElementById('problem').textContent=SLIDE.problem;
SLIDE.flow.forEach(t=>{const d=document.createElement('div');d.className='mono';d.textContent=t;document.getElementById('flow').appendChild(d)});
SLIDE.todo.forEach(t=>{const l=document.createElement('li');l.textContent=t;document.getElementById('todo').appendChild(l)});
document.getElementById('think').innerHTML=SLIDE.think;document.getElementById('count').textContent=SLIDE.count;
</script></body></html>
