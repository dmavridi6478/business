<!DOCTYPE html>
<!--
  Template: ui-tip-before-after
  Style: white page, a row of five pill tabs with one active (black), a huge tight headline, a grey one-line subtitle, two rounded cards side by side labelled Before (pink tag) and After (green tag), a footer with a SWIPE pill, slide counter and site.
  Inspired by: a seven-slide UI-design-tips carousel (@ux_dose / Meya Lab Studio). Original CSS; no source wording, name or mock-up reused. Theme: ui-white-ink
  Canvas: 1080 x 1350. One slide = one tip.
  Swap points:
    .tabs .on         active tab label (Shadows, Type, Spacing, Icons, Align)
    h1, .sub          the defect and the one-line rule
    .card.before / .card.after   the bad and fixed mini-UI (replace the inner rows)
    .foot             counter and site
-->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Tip Before After</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#0E0F12;--muted:#8A8D94;--pill:#EDEDEF;--card:#FFFFFF;--line:#ECECEE;--bad-bg:#FDE3E6;--bad:#C8283B;--ok-bg:#DDF3E5;--ok:#1E8A4C;--accent:#3B5BFF;--font:"Inter",Aptos,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;display:flex;justify-content:center;padding:32px 0;overflow-x:auto;font-family:var(--font)}
.slide{position:relative;width:1080px;height:1350px;flex:none;background:var(--bg);color:var(--ink);padding:80px 80px 70px;overflow:hidden}
.tabs{display:flex;gap:12px}.tabs span{flex:1;height:56px;border-radius:30px;background:var(--pill);display:grid;place-items:center;font:600 24px/1 var(--font)}.tabs .on{background:var(--ink);color:#fff}
h1{margin-top:80px;font:600 150px/1 var(--font);letter-spacing:-.045em}
.sub{margin-top:36px;max-width:820px;font:500 40px/1.35 var(--font);color:var(--muted)}
.pair{margin-top:100px;display:grid;grid-template-columns:1fr 1fr;gap:56px}
.card{position:relative;height:420px;border-radius:30px;border:1px solid var(--line);padding:44px 36px 30px;background:var(--card)}
.before{box-shadow:0 30px 50px rgba(0,0,0,.28)}.after{box-shadow:0 8px 24px rgba(0,0,0,.06)}
.tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);padding:8px 26px;border-radius:20px;font:600 22px/1 var(--font)}
.before .tag{background:var(--bad-bg);color:var(--bad)}.after .tag{background:var(--ok-bg);color:var(--ok)}
.row{height:56px;border-radius:14px;background:var(--pill);margin-bottom:16px}.row.s{width:60%}
.btn{display:inline-block;margin-top:12px;padding:16px 30px;border-radius:30px;background:var(--ink);color:#fff;font:600 24px/1 var(--font)}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;justify-content:space-between;align-items:center;font:500 26px/1 var(--font)}
.sw{display:flex;gap:14px;align-items:center}.sw b{padding:14px 22px;border-radius:30px;background:var(--pill);font:600 22px/1 var(--font)}.sw i{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal}
</style></head><body>
<div class="slide">
  <div class="tabs"><span>Tab</span><span class="on">Shadows</span><span>Tab</span><span>Tab</span><span>Tab</span></div>
  <h1>Defect<br>name.</h1>
  <p class="sub">One sentence naming the rule and the number to use instead.</p>
  <div class="pair">
    <div class="card before"><span class="tag">Before</span><div class="row"></div><div class="row s"></div><span class="btn">Action</span></div>
    <div class="card after"><span class="tag">After</span><div class="row"></div><div class="row s"></div><span class="btn">Action</span></div>
  </div>
  <div class="foot"><span class="sw"><b>SWIPE</b><i>→</i><b>04/07</b></span><span>yoursite.example</span></div>
</div></body></html>
