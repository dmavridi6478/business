<!doctype html>
<!--
  Vertical device frame for social/story content (TikTok, Reels, Stories).
  Inspired by "Javii" (javii.tools) content-mockup apps — free equivalent.

  Usage: replace .content's background/children with the real screenshot or
  design (e.g. <img src="..." style="width:100%;height:100%;object-fit:cover">).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social device frame</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 30% 20%, #2a2a2e, #0e0e10 70%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .device {
    width: 320px;
    height: 693px;
    border-radius: 46px;
    background: #050505;
    padding: 12px;
    box-shadow:
      0 40px 100px rgba(0,0,0,.6),
      0 0 0 2px rgba(255,255,255,.04) inset;
  }
  .content {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: linear-gradient(160deg,#ff4d6d,#7b2ff7 55%,#00c2ff);
  }
  .notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 26px;
    background: #000;
    border-radius: 16px;
    z-index: 5;
  }
  .ui-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 14px 22px;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,.4);
  }
  .side-actions {
    position: absolute;
    right: 10px; bottom: 90px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .side-actions .icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(6px);
  }
  .caption-user { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .caption-text { font-size: 14px; line-height: 1.35; max-width: 210px; }
</style>
</head>
<body>
  <div class="device">
    <div class="content">
      <div class="notch"></div>
      <div class="side-actions">
        <div class="icon"></div>
        <div class="icon"></div>
        <div class="icon"></div>
      </div>
      <div class="ui-overlay">
        <div class="caption-user">@yourbrand</div>
        <div class="caption-text">Swap this frame's background for a real screenshot or export — device chrome is done for you.</div>
      </div>
    </div>
  </div>
</body>
</html>
