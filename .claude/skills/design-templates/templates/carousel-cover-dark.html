<!DOCTYPE html>
<!--
  Carousel Cover (dark) — 1080×1350 (4:5), theme: Warm Creator Carousel
  Inspired by: "Best 8 AI Automation Tools" cover (@theromanknox).
  Layout: espresso radial glow + faint warped grid + circle, peach label block, white headline,
  two tilted 3D app tiles, curved "swipe" arrow bottom-right.

  SWAP POINTS
  - .label text ("Best 8"), .headline text
  - .tile--a / .tile--b: background colour + inner glyph (use real logos only where you have the right to)
  - Footer handle / link
  Font: Aptos per house style; falls back to Poppins (loaded).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel Cover Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--esp:#0C0304;--glow:#8D6F64;--label:#FABD7E;--ink:#1f0f0c;--white:#fff;--peach:#F2A15F;
    --tile-a:#651BE4;--tile-b:#F25475;--font:Aptos,"Aptos Display",Poppins,"Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#222;font-family:var(--font)}
  .slide{width:1080px;height:1350px;margin:0 auto;position:relative;overflow:hidden;color:var(--white);
    background:radial-gradient(ellipse 60% 45% at 50% 42%,var(--glow) 0%,#4a2a24 38%,var(--esp) 78%)}
  .grid{position:absolute;inset:0;opacity:.14;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:54px 54px;-webkit-mask:radial-gradient(circle at 50% 45%,#000 0 30%,transparent 60%);mask:radial-gradient(circle at 50% 45%,#000 0 30%,transparent 60%)}
  .ring{position:absolute;left:50%;top:44%;width:980px;height:980px;border:1.5px solid rgba(242,161,95,.25);border-radius:50%;transform:translate(-50%,-50%)}
  .content{position:relative;text-align:center;padding-top:160px}
  .label{display:inline-block;background:var(--label);color:var(--ink);font-weight:800;font-size:150px;letter-spacing:-.05em;line-height:1;padding:10px 26px 18px;border-radius:14px}
  .headline{font-weight:800;font-size:128px;line-height:.92;letter-spacing:-.05em;margin-top:26px}
  .tiles{position:absolute;left:0;right:0;top:665px;display:flex;justify-content:center;gap:0}
  .tile{width:420px;height:420px;border-radius:64px;display:grid;place-items:center;font-size:190px;font-weight:800;color:#fff;
    box-shadow:0 40px 60px -20px rgba(0,0,0,.7),inset 0 -14px 0 rgba(0,0,0,.18),inset 0 10px 0 rgba(255,255,255,.12)}
  .tile--a{background:var(--tile-a);transform:rotate(-3deg) translateX(20px)}
  .tile--b{background:var(--tile-b);transform:rotate(2deg) translateX(-20px) translateY(4px)}
  .footer{position:absolute;left:90px;bottom:54px;display:flex;align-items:center;gap:28px}
  .footer .col{font-size:21px;font-weight:700;line-height:1.1}
  .footer .col span{display:block;font-weight:500;color:var(--peach);font-size:20px}
  .footer .bar{width:2px;height:48px;background:rgba(242,161,95,.5)}
  .swipe{position:absolute;right:120px;bottom:80px;width:230px;height:110px}
</style>
</head>
<body>
<div class="slide">
  <div class="grid"></div><div class="ring"></div>
  <div class="content">
    <div class="label">Best 8</div>
    <h1 class="headline">AI Automation<br>Tools</h1>
  </div>
  <div class="tiles">
    <div class="tile tile--a">///</div>
    <div class="tile tile--b">⚯</div>
  </div>
  <footer class="footer">
    <div class="col"><span>Social media</span>@yourhandle</div>
    <div class="bar"></div>
    <div class="col"><span>Learn more</span>yoursite.com</div>
  </footer>
  <svg class="swipe" viewBox="0 0 230 110" fill="none" stroke="#B9835E" stroke-width="5" stroke-linecap="round">
    <path d="M10 8 C 20 80, 110 100, 215 84"/><path d="M190 64 L216 84 L186 100"/>
  </svg>
</div>
</body>
</html>
