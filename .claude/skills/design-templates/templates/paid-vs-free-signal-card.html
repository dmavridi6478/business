<!DOCTYPE html>
<!--
  Template: paid-vs-free-signal-card
  Style: cool grey page, huge tight navy category title, two rounded cards side by side - a pale PAID card and a rust-red FREE card - each with a white icon tile, tool name, big price, a monospace caption, and a verdict line; slide counter and handle in monospace. Theme: signal-rust-mono
  Inspired by: the "Save $8,621/year - use these free dev tools" carousel series (@modelsignal, Part 18). Original CSS; no source icon, logo, tool name or wording reused.
  Canvas: 1080 x 1350. One slide = one category. Duplicate the file per category and change the counter.
  Swap points:
    :root tokens                     colours and fonts
    .counter                         slide counter ("04/14")
    h1                               category (e.g. "Category name")
    .card.paid / .card.free          pill label, icon tile content, name, price, caption, footer line
    .stat                            small stats line (stars, contributors, last push) - fill from a checked source, never guess
    .verdict                         one-sentence call; .note the "our call" disclaimer
    .handle                          your handle (placeholder: @yourhandle)
  House rule: any saving shown must be computed from prices you checked on a stated date; print that date in .caption.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paid vs Free Signal Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E1E6EC;        /* sampled */
    --paid-bg: #F1F4FB;   /* sampled */
    --free-bg: #B4321A;   /* sampled */
    --ink: #0B1C2E;       /* sampled */
    --muted: #7C8DA6;
    --white: #FFFFFF;
    --font: "Inter", Aptos, "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #333; display: flex; justify-content: center; padding: 32px 0; overflow-x: auto; font-family: var(--font); }
  .slide { position: relative; width: 1080px; height: 1350px; flex: none; background: var(--bg); color: var(--ink); padding: 56px 64px; overflow: hidden; }
  .counter { position: absolute; top: 64px; right: 64px; font: 700 40px/1 var(--mono); letter-spacing: .08em; color: #5A7090; }
  h1 { margin-top: 96px; text-align: center; font: 800 128px/1 var(--font); letter-spacing: -.045em; }
  .cards { margin-top: 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; }
  .card { position: relative; border-radius: 34px; padding: 70px 36px 36px; min-height: 600px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 18px 40px rgba(11,28,46,.12); }
  .card.paid { background: var(--paid-bg); }
  .card.free { background: var(--free-bg); color: var(--white); }
  .pill { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font: 700 30px/1 var(--mono); letter-spacing: .14em; padding: 14px 30px; border-radius: 40px; }
  .paid .pill { background: var(--ink); color: var(--white); }
  .free .pill { background: var(--paid-bg); color: var(--free-bg); }
  .icon { width: 180px; height: 180px; border-radius: 40px; background: var(--white); display: grid; place-items: center; font: 800 64px/1 var(--font); color: var(--ink); box-shadow: 0 8px 20px rgba(11,28,46,.12); }
  .name { margin-top: 34px; font: 800 38px/1.1 var(--font); letter-spacing: -.02em; }
  .price { margin-top: 12px; font: 800 96px/1 var(--font); letter-spacing: -.04em; }
  .caption { margin-top: 10px; font: 500 18px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; opacity: .7; }
  .foot { margin-top: auto; width: 100%; text-align: left; }
  .foot small { display: block; font: 500 22px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .foot b { display: block; margin-top: 6px; font: 800 44px/1.05 var(--font); letter-spacing: -.03em; }
  .stat { font: 700 18px/1.3 var(--mono); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 8px; }
  .verdict { margin-top: 40px; text-align: center; font: 500 32px/1.45 var(--mono); }
  .verdict b { color: var(--free-bg); font-weight: 700; }
  .note { margin-top: 10px; text-align: center; font: 500 22px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #A9B6C8; }
  .handle { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font: 700 26px/1 var(--mono); letter-spacing: .16em; color: #5A7090; }
</style>
</head>
<body>
<div class="slide">
  <div class="counter">04/14</div>
  <h1>Category</h1>
  <div class="cards">
    <div class="card paid">
      <span class="pill">PAID</span>
      <div class="icon">A</div>
      <div class="name">Paid tool</div>
      <div class="price">$00.00</div>
      <div class="caption">per month · read [date]</div>
      <div class="foot"><small>a year</small><b>$000</b></div>
    </div>
    <div class="card free">
      <span class="pill">FREE</span>
      <div class="icon">B</div>
      <div class="name">Free alternative</div>
      <div class="price">$0</div>
      <div class="caption">licence checked [date]</div>
      <div class="foot"><div class="stat">0.0K stars · [date]</div><b>you run it</b></div>
    </div>
  </div>
  <p class="verdict"><b>Verdict.</b> One sentence stating what the free option does NOT replace.</p>
  <p class="note">Our call, not theirs</p>
  <div class="handle">@yourhandle</div>
</div>
</body>
</html>
