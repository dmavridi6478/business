<!DOCTYPE html>
<!--
  Workflow Grid Catalog — theme: Workflow Grid Sunset
  Inspired by: "The Complete Claude + n8n Sales System — 100 workflows" infographic.
  Layout: kicker chips + two-tone gradient headline + subtitle; a data-driven grid of small
  numbered icon tiles built by JS from one ITEMS array (so 100 items is one array edit, not
  100 hand-placed divs); coral CTA bar at the bottom.

  SWAP POINTS
  - ITEMS array in the <script>: {n, label, icon} — any length, grid re-flows automatically
  - TINTS array: rotate more/fewer pastel tile colours
  - Headline words (2 colours), subtitle, CTA text
  House style: Aptos; title 32pt, headings 14pt, body 11pt. Tile labels run smaller by necessity
  at this density — documented in design-templates/SKILL.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Catalog</title>
<style>
  :root{--top:#FFE0C5;--bot:#FFC9B8;--ink:#1A1C28;--orange:#FF560C;--pink:#FF2351;--cta:#E14423;--muted:#6b5d55;
    --font:Aptos,"Aptos Display","Segoe UI",Calibri,system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#2a1c14;--bot:#241512;--ink:#f5ece6;--muted:#c9b7ac}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:linear-gradient(180deg,var(--top),var(--bot));color:var(--ink);font-size:11pt}
  .page{max-width:980px;margin:0 auto;padding:30px 18px 0;text-align:center}
  .chips{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
  .chip{background:#fff;border-radius:16px;padding:4px 14px;font-weight:700;font-size:10pt;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  h1{font-size:32pt;font-weight:900;letter-spacing:-.02em;line-height:1.05}
  h1 .o{color:var(--orange)} h1 .p{color:var(--pink)}
  .sub{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:10pt;font-weight:700;margin:8px 0 22px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:26px}
  .tile{background:#fff;border-radius:8px;padding:8px 4px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tile .ic{width:26px;height:26px;border-radius:7px;margin:0 auto 5px;display:grid;place-items:center;font-size:13px}
  .tile .n{font-size:7.5pt;font-weight:800;color:var(--muted)}
  .tile .l{font-size:7.3pt;font-weight:700;line-height:1.1;color:var(--ink)}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--cta);color:#fff;font-weight:800;font-size:16pt;
    border-radius:16px;padding:14px 30px;margin:6px 0 32px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(5,1fr)}}
  @media (max-width:480px){.grid{grid-template-columns:repeat(4,1fr)}h1{font-size:24pt}}
</style>
</head>
<body>
<div class="page">
  <div class="chips"><div class="chip">n8n</div><div class="chip">Make</div></div>
  <h1>The Complete <span class="o">Claude</span> + <span class="p">n8n</span><br>Sales System</h1>
  <p class="sub">100 workflows for the entire sales funnel</p>
  <div class="grid" id="grid"></div>
  <div class="cta">💬 Comment "SALES" for free access →</div>
</div>
<script>
const TINTS=['#E2FDEA','#F1E9FF','#E9F3FF','#FFF6D9','#FFEAF0'];
const ITEMS=[ // n, label, icon

[11,"Follow-Up Automation","🔁"],[12,"Reply Triage","💬"],[13,"Lead Scoring","📈"],[14,"Qualification Flow","▽"],[15,"Discovery Prep","📋"],
[16,"Meeting Booker","📅"],[17,"Meeting Reminders","🔔"],[18,"Call Notes Summary","☎"],[19,"BANT Scoring","✓"],[20,"MEDDIC Analysis","👥"],
[21,"Research Account","🏢"],[22,"Stakeholder Mapping","👥"],[23,"Pain Point Finder","💡"],[24,"Value Prop Generator","✦"],[25,"Objection Handler","💬"],
[26,"Competitor Intel","👁"],[27,"Case Study Finder","📄"],[28,"ROI Calculator","🧮"],[29,"Proposal Drafter","📝"],[30,"Quote Generator","$"],

[46,"Usage Monitoring","📶"],[47,"Renewal Reminders","⏰"],[48,"Expansion Opportunities","📈"],[49,"Churn Risk Detection","⚠"],[50,"NPS Collection","★"],

[81,"Slack Notifications","#"],[82,"Gmail Integration","✉"],[83,"Calendar Management","📅"],[84,"Task Creation","✓"],[85,"Data Cleanup","🧹"],
[86,"Duplicate Finder","🔗"],[87,"Error Handling","⚠"],[88,"Auto Tagging","🏷"],[89,"Data Enrichment","🗄"],[90,"Google Sheets Sync","▦"],

];
const grid=document.getElementById('grid');
ITEMS.forEach(([n,label,icon])=>{
  const t=document.createElement('div'); t.className='tile';
  t.innerHTML=`<div class="ic" style="background:${TINTS[n%TINTS.length]}">${icon}</div><div class="n">${String(n).padStart(2,'0')}</div><div class="l">${label}</div>`;
  grid.appendChild(t);
});
</script>
</body>
</html>
