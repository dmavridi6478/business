<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instead Of Dark - Theme</title>
<style>
/* THEME: Instead Of Dark (from the @raphal3494 Rust repos carousel: warm near-black card, pale grey text, soft pill label). Light default; dark on prefers-color-scheme: dark or [data-theme="dark"]. Aptos first in the font stack. */
:root{--bg:#f4f1ee;--panel:#ffffff;--line:#ddd6cf;--ink:#1b1815;--muted:#6a625b;--accent:#b4501a;--accent2:#1f6f5c;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161311;--panel:#201c19;--line:#35302b;--ink:#efe9e3;--muted:#a79f97;--accent:#ee8a4a;--accent2:#4fc3a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161311;--panel:#201c19;--line:#35302b;--ink:#efe9e3;--muted:#a79f97;--accent:#ee8a4a;--accent2:#4fc3a8;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:800 32pt/1.08 var(--font)}h1 em{font-style:normal;color:var(--accent)}h2{font-size:14pt}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
.pill{display:inline-block;background:var(--accent);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700}
.muted{color:var(--muted)}.two{color:var(--accent2)}
</style></head><body><main>
<h1>Instead of the <em>usual one</em></h1>
<div class="card"><h2>Sample card</h2><p>Body text in Aptos at 11 pt. <span class="two">Second accent</span> for highlights.</p><p><span class="pill">Get it</span></p></div>
<p class="muted">Tokens: bg, panel, line, ink, muted, accent, accent2. Swap the values on :root to restyle any template that reads them.</p>
</main></body></html>
