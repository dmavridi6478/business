<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Lime Explainer Slide</title>
<style>
/* TEMPLATE: Neon lime explainer slide (from the @inikolov.ai "anatomy" carousel). One 1080x1350 slide: monospace kicker, a two-tone
   condensed headline (white then lime), one small caption, a dark panel with a numbered list, a source line and a page counter.
   Original CSS; the panel is a placeholder. Swap: .kicker, h1 spans, .cap, the three .item rows, .src, .count.
   Source line should name a file you actually read and the date. */
:root{--bg:#0a0a0a;--ink:#f2f2ec;--lime:#c8ff1a;--lime-ink:#111;--muted:#9a9a90;--panel:#161616;--line:#2a2a2a;
  --head:'Arial Narrow','Oswald','Bebas Neue',Impact,Aptos,sans-serif;--mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f7ee;--ink:#14150d;--lime:#4f7a00;--lime-ink:#fff;--muted:#5d6048;--panel:#fff;--line:#d9dcc6}}
:root[data-theme="light"]{--bg:#f6f7ee;--ink:#14150d;--lime:#4f7a00;--lime-ink:#fff;--muted:#5d6048;--panel:#fff;--line:#d9dcc6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;display:flex;justify-content:center;padding:24px 0;font-family:var(--font)}
.slide{width:1080px;height:1350px;background:var(--bg);color:var(--ink);padding:60px 64px;position:relative;overflow:hidden}
.kicker{font:500 26px var(--mono);letter-spacing:6px;color:var(--lime)}
h1{margin-top:20px;font:700 128px/.98 var(--head);text-transform:uppercase}h1 span{color:var(--lime)}
.cap{margin-top:22px;font:500 28px/1.4 var(--mono);text-transform:uppercase;color:var(--muted);max-width:900px}
.panel{margin-top:44px;background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:34px 40px}
.panel small{font:500 24px var(--mono);letter-spacing:5px;color:var(--muted)}
.item{display:flex;gap:26px;align-items:flex-start;margin-top:26px}.item i{flex:none;width:64px;height:64px;border-radius:12px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font:700 38px var(--head);font-style:normal}
.item b{display:block;font:700 46px/1.05 var(--head);text-transform:uppercase}.item span{font-size:30px;color:var(--muted)}
.src{position:absolute;left:64px;bottom:60px;font:500 24px var(--mono);color:var(--muted)}.count{position:absolute;right:64px;bottom:60px;font:500 24px var(--mono);color:var(--muted)}
@media (max-width:1100px){body{padding:0}.slide{width:100%;height:auto;padding:24px 18px 70px}.kicker{font-size:11px}h1{font-size:46px}.cap{font-size:12px}.panel{margin-top:18px;padding:16px;border-radius:14px}.panel small{font-size:11px}.item{gap:12px;margin-top:14px}.item i{width:32px;height:32px;font-size:20px}.item b{font-size:22px}.item span{font-size:14px}.src,.count{font-size:11px;bottom:24px}.src{left:18px}.count{right:18px}}
</style></head><body><div class="slide">
<div class="kicker">THE WHOLE THING</div>
<h1>One idea in. <span>One result out.</span></h1>
<p class="cap">One short line that names what you tested.</p>
<div class="panel"><small>WHAT YOU NEED</small>
<div class="item"><i>1</i><div><b>First need</b><span>Short note from the README</span></div></div>
<div class="item"><i>2</i><div><b>Second need</b><span>Short note from the README</span></div></div>
<div class="item"><i>3</i><div><b>Third need</b><span>Short note from the README</span></div></div></div>
<div class="src">Source: README, read 7 Nov 2026</div><div class="count">06 / 09 &rarr;</div>
</div></body></html>
