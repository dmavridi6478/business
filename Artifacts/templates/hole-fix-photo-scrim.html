<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hole And Fix Photo Scrim</title>
<style>
/* TEMPLATE: Hole and fix, photo scrim (from the @vibe.worker "5 ways your vibe-coded app will get hacked" carousel).
   One 1080x1920 story slide shown at 40% scale (30% below 480 px): a dark gradient standing in for a photo, a white title label
   ("2. An open database") and a white body label with the fix line. Original CSS; swap the gradient for your own licensed photo.
   Swap: .title, .body (keep "Fix:" as the last sentence), .handle. */
:root{--a:#0b0d12;--b:#1b2230;--glow:rgba(122,162,255,.22);--label:#fff;--label-ink:#10131a;--accent:#c2410c;--muted:#cfd5de;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--a:#1d2433;--b:#3a4660}}
:root[data-theme="light"]{--a:#1d2433;--b:#3a4660}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#202020;display:flex;justify-content:center;padding:24px 0;font-family:var(--font)}
.frame{width:432px;height:768px;position:relative;overflow:hidden;border-radius:16px}
.slide{width:1080px;height:1920px;transform:scale(.4);transform-origin:0 0;position:relative;background:radial-gradient(60% 40% at 70% 30%,var(--glow),transparent),linear-gradient(160deg,var(--b),var(--a))}
.stack{position:absolute;left:90px;right:90px;top:330px;display:grid;gap:22px;justify-items:start}
.title{background:var(--label);color:var(--label-ink);border-radius:22px;padding:22px 40px;font:700 80px/1.1 var(--font)}
.body{background:var(--label);color:var(--label-ink);border-radius:22px;padding:30px 44px;font:500 62px/1.3 var(--font)}.body b{color:var(--accent)}
.handle{position:absolute;right:90px;top:1380px;font-size:46px;color:var(--muted)}
@media (max-width:480px){.frame{width:324px;height:576px}.slide{transform:scale(.3)}}
</style></head><body><div class="frame"><div class="slide">
<div class="stack"><div class="title">2. The hole</div><div class="body">One sentence on how an outsider abuses it. <b>Fix:</b> one short line.</div></div>
<div class="handle">@yourhandle</div>
</div></div></body></html>
