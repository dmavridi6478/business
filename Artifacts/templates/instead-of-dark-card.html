<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instead Of Dark Card</title>
<style>
/* TEMPLATE: "Instead of X" dark card (from the @raphal3494 "6 Rust repos you should know about" carousel).
   One 1080x1350 slide: app tile and an "Instead of [tool]" pill, the tool name, a browser-frame screenshot panel, a two-to-three line
   description, and a swipe cue. Original CSS; the tile and screenshot are placeholders. Swap: .tile, .pill, .name, .shot, .desc, .handle.
   Say what the tool replaces only if its README or site says so. */
:root{--bg:#161311;--panel:#201c19;--line:#35302b;--ink:#efe9e3;--muted:#a79f97;--accent:#ee8a4a;--stage:#2a2521;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ee;--panel:#fff;--line:#ddd6cf;--ink:#1b1815;--muted:#6a625b;--accent:#b4501a;--stage:#ece6e0}}
:root[data-theme="light"]{--bg:#f4f1ee;--panel:#fff;--line:#ddd6cf;--ink:#1b1815;--muted:#6a625b;--accent:#b4501a;--stage:#ece6e0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2b2b2b;display:flex;justify-content:center;padding:24px 0;font-family:var(--font)}
.slide{width:1080px;height:1350px;background:var(--bg);color:var(--ink);padding:64px 72px;position:relative;overflow:hidden;text-align:center}
.top{display:flex;gap:22px;justify-content:center;align-items:center}
.tile{width:112px;height:112px;border-radius:26px;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;font-size:40px;color:var(--accent);font-weight:800}
.pill{border:3px solid var(--line);border-radius:999px;padding:14px 36px;font-size:36px;color:var(--muted)}
.name{margin-top:26px;font:500 120px/1 var(--font);letter-spacing:-2px;overflow-wrap:anywhere}
.shot{margin-top:46px;border:3px solid var(--line);border-radius:28px;overflow:hidden;background:var(--panel)}
.bar{display:flex;gap:10px;padding:16px 22px;border-bottom:3px solid var(--line)}.bar i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.stage{height:520px;background:var(--stage);display:grid;place-items:center;color:var(--muted);font-size:30px;padding:24px}
.desc{margin-top:40px;font-size:42px;line-height:1.45;color:var(--muted)}
.handle{position:absolute;left:72px;bottom:44px;font-size:28px;color:var(--muted)}.swipe{position:absolute;right:72px;bottom:44px;font-size:34px;color:var(--muted)}
@media (max-width:1100px){body{padding:0}.slide{width:100%;height:auto;padding:24px 18px 70px}.tile{width:52px;height:52px;border-radius:12px;font-size:20px}.pill{font-size:15px;padding:7px 16px}.name{font-size:46px;margin-top:14px}.shot{margin-top:18px;border-radius:14px}.stage{height:auto;min-height:150px;font-size:14px}.desc{font-size:16px;margin-top:18px}.handle,.swipe{font-size:13px;bottom:24px}.handle{left:18px}.swipe{right:18px}}
</style></head><body><div class="slide">
<div class="top"><div class="tile">T</div><div class="pill">Instead of [tool]</div></div>
<div class="name">Tool name</div>
<div class="shot"><div class="bar"><i></i><i></i><i></i></div><div class="stage">Replace with a real screenshot</div></div>
<p class="desc">Two or three plain lines that match the project's own README.</p>
<div class="handle">@yourhandle</div><div class="swipe">Swipe &rarr;</div>
</div></body></html>
