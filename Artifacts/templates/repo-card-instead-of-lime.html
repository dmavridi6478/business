<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Card - Instead Of Lime</title>
<style>
/* TEMPLATE: Repo card with an "Instead of" strip (from the @regularbasis.studio "5 More GitHub Repos" carousel).
   One 1080x1920 story slide shown at 40% scale (30% below 480 px): page counter and handle, a mono kicker, a lime rank number with the repo name,
   a repo path with a stars chip and a licence chip, one bold sentence, a bordered "Instead of ~~paid thing~~ -> free thing" strip, a screenshot
   placeholder and a swipe pill. Original CSS; the dark gradient stands in for the photo, the panel for the screenshot.
   Swap: .count, .handle, .kicker, .rank, .name, .path, .stars, .lic, .claim, .strip, .shot, .swipe.
   Licence from the repo's file, stars labelled as an unchecked snapshot, and the "instead of" line only if the README supports it. */
:root{--bg:#050505;--ink:#f4f4ef;--muted:#9a9a92;--lime:#c8ff1a;--lime-ink:#0a0a0a;--line:#2a2a2a;--panel:#111;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif;--mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace;--head:'Arial Narrow','Oswald',Impact,Aptos,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f7ee;--ink:#14150d;--muted:#5d6048;--lime:#4f7a00;--lime-ink:#fff;--line:#d9dcc6;--panel:#fff}}
:root[data-theme="light"]{--bg:#f6f7ee;--ink:#14150d;--muted:#5d6048;--lime:#4f7a00;--lime-ink:#fff;--line:#d9dcc6;--panel:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#202020;display:flex;justify-content:center;padding:24px 0;font-family:var(--font)}
.frame{width:432px;height:768px;position:relative;overflow:hidden;border-radius:16px}
.slide{width:1080px;height:1920px;transform:scale(.4);transform-origin:0 0;background:var(--bg);color:var(--ink);padding:80px 70px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;font:500 26px var(--mono);color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:18px}
.kicker{margin-top:90px;font:500 24px var(--mono);letter-spacing:6px;color:var(--muted)}
h1{margin-top:14px;font:800 120px/1 var(--head);letter-spacing:-2px;overflow-wrap:anywhere}h1 b{color:var(--lime);margin-right:20px}
.meta{margin-top:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:500 28px var(--mono);color:var(--muted)}
.chip{background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:8px 24px;font-weight:700}.chip.o{background:none;color:var(--ink);border:2px solid var(--line)}
.claim{margin-top:34px;font:700 44px/1.3 var(--font)}.claim span{color:var(--muted);font-weight:500}
.strip{margin-top:30px;border:2px solid var(--lime);border-radius:20px;padding:22px 28px;font:500 28px var(--mono)}.strip s{color:var(--muted)}.strip b{color:var(--ink)}
.shot{margin-top:36px;height:620px;border-radius:24px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);font-size:30px;text-align:center;padding:20px}
.swipe{position:absolute;left:70px;bottom:70px;border:2px solid var(--line);border-radius:999px;padding:18px 36px;font:500 24px var(--mono);letter-spacing:4px;color:var(--muted)}
@media (max-width:480px){.frame{width:324px;height:576px}.slide{transform:scale(.3)}}
</style></head><body><div class="frame"><div class="slide">
<div class="top"><span>03 / 07</span><span>@yourhandle</span></div>
<div class="kicker">CATEGORY &middot; KEYWORD</div>
<h1><b>01</b>Repo name</h1>
<div class="meta"><span>owner/repo-name</span><span class="chip">&#9733; 0.0K</span><span class="chip o">MIT</span></div>
<p class="claim">What it does, from the README. <span>One more plain sentence.</span></p>
<div class="strip">INSTEAD OF &nbsp;<s>the paid thing</s> &rarr; <b>what you get</b></div>
<div class="shot">Replace with a real screenshot</div>
<div class="swipe">&rarr; SWIPE FOR REPO #2</div>
</div></div></body></html>
