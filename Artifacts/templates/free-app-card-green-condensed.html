<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free App Card - Green Condensed</title>
<style>
/* TEMPLATE: Free app card, green condensed (from the @emmanuelnyatefe KOOEMMA "10 free apps" carousel).
   One 1080x1350 slide: brand tag, a ghost number, a heavy condensed app name, one line, a device mockup panel, and a three-column
   "Good for / Replaces / Works on" row. Original CSS; the mockup is a placeholder, no source screenshot is reused.
   Swap: .tag, .ghost, .name, .line, .mock, the three .col items, .handle. Check "Works on" against the README, not the slide. */
:root{--bg:#f1f3f2;--ink:#0d1f17;--muted:#55645b;--accent:#1f7a4d;--line:#d4dbd7;--ghost:rgba(31,122,77,.1);--panel:#fff;--stage:#e4e9e6;
  --head:'Arial Narrow','Oswald','Bebas Neue',Impact,Aptos,sans-serif;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--ink:#e9f1ec;--muted:#9bb0a4;--accent:#4fd08f;--line:#2b3a32;--ghost:rgba(79,208,143,.12);--panel:#17211c;--stage:#1d2a23}}
:root[data-theme="dark"]{--bg:#0e1512;--ink:#e9f1ec;--muted:#9bb0a4;--accent:#4fd08f;--line:#2b3a32;--ghost:rgba(79,208,143,.12);--panel:#17211c;--stage:#1d2a23}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2b2b2b;display:flex;justify-content:center;padding:24px 0;font-family:var(--font)}
.slide{width:1080px;height:1350px;background:var(--bg);color:var(--ink);padding:64px 72px;position:relative;overflow:hidden}
.tag{font:700 30px var(--font);letter-spacing:5px;color:var(--accent)}
.ghost{position:absolute;right:56px;top:20px;font:900 300px/1 var(--head);color:var(--ghost)}
.name{margin-top:90px;font:900 150px/.95 var(--head);text-transform:uppercase;letter-spacing:-2px;position:relative;overflow-wrap:anywhere}
.line{margin-top:20px;font-size:40px;color:var(--muted);max-width:760px;line-height:1.35;position:relative}
.mock{margin-top:56px;height:430px;border-radius:30px;background:var(--stage);border:3px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:30px;text-align:center;padding:24px}
.cols{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.col b{display:block;font-size:34px}.col span{font-size:28px;color:var(--muted);line-height:1.35}
.handle{position:absolute;left:72px;bottom:50px;font-size:28px;color:var(--muted)}.swipe{position:absolute;right:72px;bottom:50px;font-size:28px;color:var(--muted)}
@media (max-width:1100px){body{padding:0}.slide{width:100%;height:auto;padding:24px 18px 70px}.ghost{font-size:120px;right:12px;top:8px}.tag{font-size:13px}.name{font-size:56px;margin-top:40px}.line{font-size:17px}.mock{height:auto;min-height:150px;margin-top:20px;font-size:14px;border-radius:16px}.cols{grid-template-columns:1fr;gap:10px;margin-top:18px}.col b{font-size:16px}.col span{font-size:14px}.handle,.swipe{font-size:13px;bottom:24px}.handle{left:18px}.swipe{right:18px}}
</style></head><body><div class="slide">
<div class="tag">YOUR BRAND &middot; FREE APPS</div><div class="ghost">01</div>
<div class="name">App name</div>
<p class="line">One plain line about what the app does.</p>
<div class="mock">Replace with a real screenshot or device mockup</div>
<div class="cols"><div class="col"><b>Good for</b><span>The job it does</span></div><div class="col"><b>Replaces</b><span>The paid tool</span></div><div class="col"><b>Works on</b><span>Platforms from the README</span></div></div>
<div class="handle">@yourhandle</div><div class="swipe">swipe &rarr;</div>
</div></body></html>
