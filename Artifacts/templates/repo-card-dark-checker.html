<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repo Card - Dark Checker</title>
<style>
/* TEMPLATE: Repo card, dark green checker (from the @dotdevs "5 GitHub projects worth exploring" carousel).
   One 1080x1920 story slide shown at 40% scale (30% below 480 px) inside a .frame: dark green checker background, a rank chip, repo name,
   one line of description, a star snapshot with its date, a white screenshot panel and a licence/platform row.
   Original CSS; the screenshot panel is a placeholder. Swap: .rank, .repo, .desc, .stars, .shot, .meta items, .handle.
   Star counts are a snapshot taken from a slide: label the date and say they were not checked. */
:root{--a:#10311d;--b:#0d2918;--ink:#f1f7f2;--muted:#a9c4b0;--chip:#7be08f;--chip-ink:#0b2214;--panel:#fff;--panel-ink:#142018;--panel-line:#d7e4da;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a:#0a1d11;--b:#07160d;--panel:#16261b;--panel-ink:#e8f3ea;--panel-line:#2a4030}}
:root[data-theme="dark"]{--a:#0a1d11;--b:#07160d;--panel:#16261b;--panel-ink:#e8f3ea;--panel-line:#2a4030}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#202020;font-family:var(--font);display:flex;justify-content:center;padding:24px 0}
.frame{width:432px;height:768px;position:relative;overflow:hidden;border-radius:16px}
.slide{width:1080px;height:1920px;transform:scale(.4);transform-origin:0 0;padding:110px 84px;color:var(--ink);
  background-color:var(--a);background-image:linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%),linear-gradient(45deg,var(--b) 25%,transparent 25%,transparent 75%,var(--b) 75%);background-size:80px 80px;background-position:0 0,40px 40px}
.rank{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:14px 34px;font:800 40px var(--font)}
.repo{margin-top:40px;font:900 108px/1.02 var(--font);letter-spacing:-2px;overflow-wrap:anywhere}
.desc{margin-top:26px;font-size:42px;line-height:1.4;color:var(--muted)}
.stars{margin-top:30px;font-size:38px;color:var(--chip)}.stars small{color:var(--muted);font-size:28px;margin-left:12px}
.shot{margin-top:56px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--panel-line);border-radius:34px;height:640px;display:grid;place-items:center;font-size:34px;text-align:center;padding:30px}
.meta{margin-top:40px;display:flex;gap:18px;flex-wrap:wrap}.meta span{border:3px solid var(--panel-line);border-radius:999px;padding:12px 30px;font-size:32px;color:var(--ink)}
.handle{position:absolute;left:84px;bottom:90px;font-size:34px;color:var(--muted)}
@media (max-width:480px){.frame{width:324px;height:576px}.slide{transform:scale(.3)}}
</style></head><body><div class="frame"><div class="slide">
<span class="rank">#1</span>
<div class="repo">owner/repo-name</div>
<p class="desc">One plain sentence that matches the repo's README.</p>
<p class="stars">&#9733; 0,000<small>snapshot, date, not checked</small></p>
<div class="shot">Replace with a real screenshot</div>
<div class="meta"><span>MIT</span><span>Windows, macOS, Linux</span><span>README install line</span></div>
<div class="handle">@yourhandle</div>
</div></div></body></html>
