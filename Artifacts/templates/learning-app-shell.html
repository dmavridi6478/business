<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning App Shell</title>
<style>
/* TEMPLATE: Learning App Shell (from the "Turn YouTube videos into learning app" sheet).
   Edit only the COURSE object at the bottom. Sections of small steps, a real example, a quiz after each section,
   a "covered so far" summary and progress saved in this browser. No network needed. */
:root{--bg:#faf7f2;--card:#fff;--ink:#17140f;--muted:#6b6256;--line:#e4dccf;--accent:#e8420b;--ok:#2f7d32;--bad:#b3261e;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--card:#1f1c17;--ink:#f3ede2;--muted:#a69d8d;--line:#35302a;--accent:#ff6a3a;--ok:#7fd48a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#14120f;--card:#1f1c17;--ink:#f3ede2;--muted:#a69d8d;--line:#35302a;--accent:#ff6a3a;--ok:#7fd48a;--bad:#ff8a80}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:24px 16px}
.app{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:240px 1fr;gap:20px}
header{grid-column:1/-1}
h1{font-size:32pt;line-height:1.05;font-weight:800;letter-spacing:-.5px}h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:6px}
.bar{height:10px;background:var(--line);border-radius:6px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
nav{display:flex;flex-direction:column;gap:8px}
nav button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
nav button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
nav button .t{font-weight:700;display:block}nav button .s{color:var(--muted);font-size:10pt}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
h2{font-size:14pt;margin:18px 0 8px}h2:first-child{margin-top:0}
ol{padding-left:22px}li{margin:6px 0}
.ex{border-left:4px solid var(--accent);padding:8px 14px;background:var(--bg);border-radius:0 10px 10px 0}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.q p{font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);color:var(--ok)}.opt.wrong{border-color:var(--bad);color:var(--bad)}
.why{margin-top:6px;color:var(--muted);font-size:10pt}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sum{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px}
@media (max-width:720px){.app{grid-template-columns:1fr}h1{font-size:24pt}}
</style></head><body>
<div class="app">
<header><h1 id="ttl"></h1><p class="sub" id="sub"></p><div class="bar"><i id="bar"></i></div><p class="sub" id="pct"></p></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
</div>
<script>
/* ===== EDIT THIS OBJECT ONLY ===== */
const COURSE = {
  title: "Earned value in <span>plain English</span>",
  subtitle: "Sample course. Replace with sections built from your video transcript.",
  sections: [
    { title: "Where the project stands",
      steps: ["Planned value (PV) is the budget for the work that should be finished by today.",
              "Earned value (EV) is the budget for the work actually finished.",
              "Actual cost (AC) is what you really spent."],
      example: "Plan: 100k of work by today. Finished: 90k worth. Spent: 110k. PV 100k, EV 90k, AC 110k.",
      quiz: [{ q: "Which number is the budgeted value of work actually done?", options: ["PV", "EV", "AC"], answer: 1,
               why: "EV is the value earned by finished work; PV is the plan, AC is the spend." }] },
    { title: "Are we on budget and on time",
      steps: ["Cost variance CV = EV - AC. Negative means over budget.",
              "Schedule variance SV = EV - PV. Negative means behind.",
              "CPI = EV / AC and SPI = EV / PV. Below 1 is bad."],
      example: "With the sample numbers CV = -20k, SV = -10k, CPI = 0.82, SPI = 0.90: over budget and behind.",
      quiz: [{ q: "CPI is 0.82. What does it mean?", options: ["Each unit spent earns 0.82 of planned value", "The project is 82% complete", "The project is ahead of schedule"], answer: 0,
               why: "CPI compares value earned with money spent; below 1 means you earn less than you spend." },
             { q: "SV = EV - PV is positive. The project is...", options: ["Behind schedule", "Ahead of schedule", "Over budget"], answer: 1,
               why: "More value earned than planned means ahead." }] }
  ]
};
/* ===== END EDIT ===== */
const KEY = "learning-app:" + COURSE.title.replace(/<[^>]*>/g, "");
let st = { done: {}, answers: {}, notes: {}, cur: 0 };
try { const s = localStorage.getItem(KEY); if (s) st = Object.assign(st, JSON.parse(s)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const $ = id => document.getElementById(id);
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function secDone(i){ return COURSE.sections[i].quiz.every((q, j) => st.answers[i + "-" + j] === q.answer); }
function render(){
  $("ttl").innerHTML = COURSE.title; $("sub").textContent = COURSE.subtitle;
  const n = COURSE.sections.length, d = COURSE.sections.filter((s, i) => secDone(i)).length;
  $("bar").style.width = (100 * d / n) + "%"; $("pct").textContent = d + " of " + n + " sections passed";
  $("nav").innerHTML = COURSE.sections.map((s, i) => '<button data-i="' + i + '" aria-current="' + (i === st.cur) + '"><span class="t">' + (secDone(i) ? "&#10003; " : "") + (i + 1) + ". " + esc(s.title) + '</span><span class="s">' + s.quiz.length + ' question(s)</span></button>').join("");
  const s = COURSE.sections[st.cur], i = st.cur;
  let h = "<h2>" + esc(s.title) + "</h2><ol>" + s.steps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol><h2>Example</h2><div class='ex'>" + esc(s.example) + "</div><h2>Check yourself</h2>";
  s.quiz.forEach((q, j) => {
    const a = st.answers[i + "-" + j];
    h += "<div class='q'><p>" + esc(q.q) + "</p>" + q.options.map((o, k) => "<button class='opt" + (a === undefined ? "" : (k === q.answer ? " right" : (k === a ? " wrong" : ""))) + "' data-q='" + i + "-" + j + "' data-k='" + k + "'>" + esc(o) + "</button>").join("") + (a === undefined ? "" : "<div class='why'>" + (a === q.answer ? "Correct. " : "Not quite. ") + esc(q.why) + "</div>") + "</div>";
  });
  h += "<h2>My notes</h2><textarea id='notes' placeholder='Questions to look up, in your own words'>" + esc(st.notes[i] || "") + "</textarea>";
  h += "<div class='sum'><b>Covered so far:</b> " + (COURSE.sections.filter((x, k) => secDone(k)).map(x => esc(x.title)).join("; ") || "nothing yet") + "</div>";
  h += "<div class='row'><button class='btn ghost' id='prev'>Previous</button><button class='btn' id='next'>Next section</button><button class='btn ghost' id='reset'>Reset progress</button></div>";
  $("main").innerHTML = h;
  $("notes").oninput = e => { st.notes[i] = e.target.value; save(); };
  $("prev").onclick = () => { st.cur = Math.max(0, st.cur - 1); save(); render(); };
  $("next").onclick = () => { st.cur = Math.min(n - 1, st.cur + 1); save(); render(); };
  $("reset").onclick = () => { st = { done: {}, answers: {}, notes: {}, cur: 0 }; save(); render(); };
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.i !== undefined) { st.cur = +b.dataset.i; save(); render(); }
  else if (b.dataset.q !== undefined && st.answers[b.dataset.q] === undefined) { st.answers[b.dataset.q] = +b.dataset.k; save(); render(); }
});
render();
</script></body></html>
