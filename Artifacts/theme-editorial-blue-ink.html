<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Blue and Ink - Theme</title>
<style>
/* THEME: Editorial Blue & Ink (from the @your.aimentor "5 Claude writing use cases" graphic). Colours marked sampled were read from pixels.
   Use for one-page explainers: giant blue numeral, heavy serif headlines, white cards, soft-blue and soft-red callouts. Light default; dark via [data-theme="dark"] or prefers-color-scheme. */
:root{--bg:#fefffc;--ink:#060605;--muted:#4a5568;--blue:#0153d7;--soft:#e7f2fd;--warn:#ffe2e1;--warn-ink:#b3261e;--card:#fff;--line:#cfd6e2;--radius:10px;--font:Aptos,'Segoe UI',system-ui,sans-serif;--display:'Playfair Display',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--ink:#f4f6fb;--muted:#aab4c6;--blue:#6ea0ff;--soft:#15233a;--warn:#3a1b1b;--warn-ink:#ff9a94;--card:#141a24;--line:#2b3547}}
:root[data-theme="dark"]{--bg:#0d1118;--ink:#f4f6fb;--muted:#aab4c6;--blue:#6ea0ff;--soft:#15233a;--warn:#3a1b1b;--warn-ink:#ff9a94;--card:#141a24;--line:#2b3547}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,44px);line-height:1.05}h1 span{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:6px}
.card b{font-family:var(--display);font-size:30px;color:var(--blue)}
.note{background:var(--soft);border-radius:8px;padding:8px 10px}.warn{background:var(--warn);color:var(--warn-ink)}
button{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;justify-self:start}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style></head><body><main>
<h1>Better writing builds <span>better thinking</span></h1>
<div class="card"><b>01</b><strong>Executive compression</strong><span class="note">20 pages become one decision memo</span></div>
<div class="card"><b>03</b><strong>Argument strengthening</strong><span class="note warn">Weakest premise?</span></div>
<button type="button">Run a writing check</button>
</main></body></html>
