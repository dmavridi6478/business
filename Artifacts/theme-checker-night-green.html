<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checker Night Green - Theme</title>
<style>
/* THEME: Checker Night Green (from the @dotdevs repo carousel: dark green checker background, white panels, lime accent). Light default; dark on prefers-color-scheme: dark or [data-theme="dark"]. Aptos first in the font stack. */
:root{--bg:#eef3ec;--panel:#ffffff;--line:#cddac8;--ink:#101a12;--muted:#51604f;--accent:#1f7a3a;--accent2:#a05a00;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--panel:#17261b;--line:#2a4030;--ink:#eaf3ea;--muted:#9db5a0;--accent:#7be08f;--accent2:#f0b35a}}
:root[data-theme="dark"]{--bg:#0e1a12;--panel:#17261b;--line:#2a4030;--ink:#eaf3ea;--muted:#9db5a0;--accent:#7be08f;--accent2:#f0b35a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:800 32pt/1.08 var(--font)}h1 em{font-style:normal;color:var(--accent)}h2{font-size:14pt}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
.pill{display:inline-block;background:var(--accent);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700}
.muted{color:var(--muted)}.two{color:var(--accent2)}
</style></head><body><main>
<h1>Repos worth <em>a closer look</em></h1>
<div class="card"><h2>Sample card</h2><p>Body text in Aptos at 11 pt. <span class="two">Second accent</span> for highlights.</p><p><span class="pill">Get it: GitHub</span></p></div>
<p class="muted">Tokens: bg, panel, line, ink, muted, accent, accent2. Swap the values on :root to restyle any template that reads them.</p>
</main></body></html>
