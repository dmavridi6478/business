<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Paper and Terracotta - Theme</title>
<style>
/* THEME: Grid Paper & Terracotta (from the "Claude Code plugins nobody installs" slides). Use for tool/plugin rankings, install cards.
   Light default (graph paper); dark variant on [data-theme="dark"] or prefers-color-scheme. */
:root{--bg:#f6f0e6;--grid:rgba(0,0,0,.06);--ink:#161513;--code-bg:#1f1d1b;--code-text:#e8e2d6;--accent:#d97757;--pill-bg:#161513;--pill-ink:#fff;--muted:#6f675a;--font:'Inter','Helvetica Neue',Arial,sans-serif;--mono:'JetBrains Mono',Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--grid:rgba(255,255,255,.05);--ink:#f3ede2;--code-bg:#0d0c0b;--code-text:#e8e2d6;--pill-bg:#f3ede2;--pill-ink:#161513;--muted:#a69d8d}}
:root[data-theme="dark"]{--bg:#171513;--grid:rgba(255,255,255,.05);--ink:#f3ede2;--code-bg:#0d0c0b;--code-text:#e8e2d6;--pill-bg:#f3ede2;--pill-ink:#161513;--muted:#a69d8d}
*{box-sizing:border-box;margin:0;padding:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;color:var(--ink);font-family:var(--font);padding:48px 20px;min-height:100vh}
main{max-width:620px;margin:0 auto;display:grid;gap:20px}
h1{font-size:clamp(34px,8vw,56px);line-height:1.02;font-weight:800;letter-spacing:-1.5px}h1 span{color:var(--accent)}
.pill{display:inline-block;background:var(--pill-bg);color:var(--pill-ink);border-radius:40px;padding:12px 38px;font-weight:800;font-size:22px}.pill b{color:var(--accent)}
.code{background:var(--code-bg);color:var(--code-text);border-radius:22px;padding:22px 26px;font-family:var(--mono);font-size:14px;line-height:2}.code .p{color:#fff;font-weight:700}
.install{font-family:var(--mono);font-size:13px;color:var(--accent);word-break:break-all}
.note{font-size:20px;font-weight:700;line-height:1.3}.next{color:var(--accent);font-weight:800}
</style></head><body><main>
<h1><span>#1: PayPal</span><br>adds payments and subscriptions</h1>
<div><span class="pill"><b>11</b> installs</span></div>
<div class="code"><div class="p">&gt; add a monthly plan with PayPal</div>payments and subscriptions<br>invoices and disputes<br>PayPal’s APIs and MCP server</div>
<div class="install">$ /plugin install paypal@claude-plugins-official</div>
<p class="note">Official, made by PayPal.</p><p class="next">#2 is from the Google Chrome team →</p>
</main></body></html>
