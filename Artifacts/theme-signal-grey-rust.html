<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Grey and Rust - Theme</title>
<style>
/* THEME: Signal Grey & Rust (from the @modelsignal paid-vs-free carousels). Use for comparison cards, price tables, swap ledgers.
   Light default; dark variant via [data-theme="dark"] or prefers-color-scheme. Labels are monospace, headings tight and heavy. */
:root{--bg:#e9edf2;--surface:#f3f5fa;--border:#cdd5e1;--text:#0f1b2d;--muted:#5a6b86;--accent:#b0331a;--accent-ink:#fff;--navy:#0f1b2d;--radius:14px;--font:Aptos,'Segoe UI',system-ui,sans-serif;--mono:ui-monospace,'SF Mono',Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--surface:#172136;--border:#2a3a58;--text:#e8eefb;--muted:#9fb0cc;--accent:#ff7a5c;--accent-ink:#1a0600;--navy:#e8eefb}}
:root[data-theme="dark"]{--bg:#0f1624;--surface:#172136;--border:#2a3a58;--text:#e8eefb;--muted:#9fb0cc;--accent:#ff7a5c;--accent-ink:#1a0600;--navy:#e8eefb}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:40px 16px}
main{max-width:760px;margin:0 auto;display:grid;gap:22px}
h1{font-size:clamp(34px,7vw,56px);line-height:1;font-weight:800;letter-spacing:-.04em;text-align:center}h1 span{color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;display:grid;gap:6px}
.card.free{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{font:700 11px var(--mono);letter-spacing:.2em}
.price{font-size:40px;font-weight:800;letter-spacing:-.04em}
.mono{font:12px var(--mono);letter-spacing:.12em;color:var(--muted)}.free .mono{color:inherit;opacity:.8}
button{font:inherit;font-weight:700;background:var(--navy);color:var(--bg);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.pair{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Paid <span>vs</span> free</h1>
<div class="pair"><div class="card"><div class="tag">PAID</div><h3>Tool A</h3><div class="price">$29</div><div class="mono">A YEAR $348</div></div>
<div class="card free"><div class="tag">FREE</div><h3>Tool B</h3><div class="price">$0</div><div class="mono">PLUS YOUR TIME TO RUN IT</div></div></div>
<div><button type="button">Run the swap check</button></div>
</main></body></html>
