<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Meadow - Theme</title>
<style>
/* THEME: Purple Meadow (from the @martiendejong_dev animation-tools carousel). Light default; dark on prefers-color-scheme: dark or [data-theme="dark"]. */
:root{--bg:#f1edff;--panel:#fff;--line:#cdbdf5;--ink:#1b1330;--muted:#4a3f66;--accent:#6f3fd1;--accent2:#c23a82;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17113a;--panel:#211a4f;--line:#4b3f8a;--ink:#f1edff;--muted:#cfc6ee;--accent:#b79bff;--accent2:#ff8bc2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17113a;--panel:#211a4f;--line:#4b3f8a;--ink:#f1edff;--muted:#cfc6ee;--accent:#b79bff;--accent2:#ff8bc2;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:800 32pt/1.08 var(--font)}h1 em{font-style:normal;color:var(--accent2)}h2{font-size:14pt}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.chip{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:4px 14px;font-weight:600;margin-right:6px}
.muted{color:var(--muted)}
</style></head><body><main><h1>Tools worth a <em>second look</em></h1>
<div class="card"><h2>Sample card</h2><p>Body text in Aptos at 11 pt.</p><p><span class="chip">Open source</span><span class="chip">Checked licence</span></p></div>
<p class="muted">Tokens: bg, panel, line, ink, muted, accent, accent2.</p></main></body></html>
