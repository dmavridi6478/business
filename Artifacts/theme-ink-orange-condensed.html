<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink and Orange Condensed - Theme</title>
<style>
/* THEME: Ink & Orange Condensed (from the @buildwithkenny trending carousel). Use for ranked lists, repo cards, weekly roundups.
   Dark default; light variant on [data-theme="light"] or prefers-color-scheme: light. */
:root{--bg:#121212;--panel:#16181c;--line:#2a2d33;--ink:#ecebe5;--muted:#8d8b84;--accent:#e8873a;--link:#58a6ff;--cond:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;--body:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ec;--panel:#fff;--line:#d9d5ca;--ink:#17160f;--muted:#6b665c;--accent:#c9621a}}
:root[data-theme="light"]{--bg:#f3f1ec;--panel:#fff;--line:#d9d5ca;--ink:#17160f;--muted:#6b665c;--accent:#c9621a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--body);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:400 64px/1 var(--cond);text-transform:uppercase}h1 em{font-style:normal;color:var(--accent)}h2{font-size:14pt}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px}.muted{color:var(--muted)}
</style></head><body><main>
<h1>Trending <em>this week</em></h1>
<div class="card"><h2>03 stablyai/orca</h2><p class="muted">One place to run a fleet of coding agents side by side.</p></div>
<p class="muted">Palette: ink #121212, panel #16181c, text #ecebe5, accent #e8873a, link #58a6ff. Headline in a condensed face (Bebas Neue, Oswald or Arial Narrow fallback).</p>
</main></body></html>
