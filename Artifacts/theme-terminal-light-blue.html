<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Light Blue - Theme</title>
<style>
/* THEME: Terminal Light Blue (from the @wavaai.feeds terminal prompt screenshots). Light default; dark on prefers-color-scheme: dark or [data-theme="dark"]. */
:root{--bg:#e9ecf1;--panel:#fff;--line:#d6dae2;--ink:#1b1f27;--muted:#5b6473;--accent:#1f4fb3;--accent2:#7a3fb0;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--panel:#161a22;--line:#2d3441;--ink:#e6e9ef;--muted:#9aa3b2;--accent:#7aa2ff;--accent2:#c79bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--panel:#161a22;--line:#2d3441;--ink:#e6e9ef;--muted:#9aa3b2;--accent:#7aa2ff;--accent2:#c79bff;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:800 32pt/1.08 var(--font)}h1 em{font-style:normal;color:var(--accent)}h2{font-size:14pt}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.pill{display:inline-block;background:var(--accent);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700}
.muted{color:var(--muted)}.two{color:var(--accent2)}
</style></head><body><main><h1>Specs that <em>say what they cannot do</em></h1>
<div class="card"><h2>Sample card</h2><p>Body text in Aptos at 11 pt. <span class="two">Purple markers.</span></p><p><span class="pill">Copy</span></p></div>
<p class="muted">Tokens: bg, panel, line, ink, muted, accent, accent2.</p></main></body></html>
