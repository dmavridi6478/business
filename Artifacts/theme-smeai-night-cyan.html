<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SME AI Night Cyan - Theme</title>
<style>
/* THEME: SME AI Night Cyan (from the SME AI LinkedIn guide PDF). Dark default (near-black, cyan and green); light on prefers-color-scheme: light or [data-theme="light"]. */
:root{--bg:#050608;--panel:#0d0f14;--line:#1c2530;--ink:#f3f5f7;--muted:#9aa5b1;--accent:#22c7e8;--accent2:#2be58a;--font:Aptos,'Segoe UI',Inter,Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7f9;--panel:#fff;--line:#d3dde5;--ink:#0b1218;--muted:#53606c;--accent:#006f88;--accent2:#0a7a45;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f7f9;--panel:#fff;--line:#d3dde5;--ink:#0b1218;--muted:#53606c;--accent:#006f88;--accent2:#0a7a45;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:11pt/1.55 var(--font);padding:40px 16px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font:800 32pt/1.08 var(--font)}h1 em{font-style:normal;color:var(--accent)}h2{font-size:14pt}
.card{background:var(--panel);border-left:4px solid var(--accent);padding:14px 18px}
.pill{display:inline-block;background:var(--accent);color:var(--bg);border-radius:999px;padding:6px 16px;font-weight:700}
.muted{color:var(--muted)}.two{color:var(--accent2)}
</style></head><body><main><h1>Fifteen prompts, <em>one method</em></h1>
<div class="card"><h2>Sample card</h2><p>Body text in Aptos at 11 pt. <span class="two">Green for callouts.</span></p><p><span class="pill">Copy</span></p></div>
<p class="muted">Tokens: bg, panel, line, ink, muted, accent, accent2.</p></main></body></html>
